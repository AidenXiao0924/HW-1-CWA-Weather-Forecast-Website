<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台灣氣象觀測所 · Taiwan Weather Lab</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/style.css"><script src="/assets/app.js" defer></script></head>
<body><header class="tw-header"><a class="tw-brand" href="/" aria-label="首頁"><span class="tw-symbol">◉</span><span>台灣氣象觀測所<small>TAIWAN WEATHER LAB</small></span></a><nav aria-label="頁面"><button id="mapTab" class="active">即時觀測</button><button id="forecastTab">一週預報</button></nav><span id="mode" class="tw-badge">載入中</span></header>
<div id="notice" class="tw-notice" role="status">正在取得氣象資料…</div>
<main><section id="observationView" class="tw-workspace"><aside class="tw-sidebar"><div class="tw-eyebrow">OBSERVATION / TAIWAN</div><h1>此刻，台灣幾度？</h1><p class="tw-muted">從測站看見每一地的溫度。</p><label for="search">搜尋測站</label><input id="search" type="search" placeholder="輸入測站或鄉鎮名稱"><div class="tw-two"><div><label for="county">縣市</label><select id="county"><option value="">全台灣</option></select></div><div><label for="threshold">氣溫篩選</label><select id="threshold"><option value="">所有氣溫</option><option value="30">30°C 以上</option><option value="35">35°C 以上</option><option value="20">20°C 以上</option></select></div></div><div class="tw-summary"><span>符合條件測站<strong id="stationCount">—</strong></span><span>測站平均<strong id="average">—</strong></span></div><div class="tw-list-heading">測站列表 <span>點選查看詳情</span></div><div id="stations" class="tw-stations" aria-live="polite"></div><footer class="tw-sidebar-footer"><span id="updated">尚未取得觀測時間</span><button id="refresh" title="重新取得測站資料">↻ 更新</button></footer></aside>
<div class="tw-map-panel"><div class="tw-map-toolbar"><div><span class="tw-eyebrow">氣象背景圖層</span><div class="tw-layer-buttons" id="layers"><button data-layer="wind">風場</button><button data-layer="temp">氣溫</button><button data-layer="rain">降雨</button><button data-layer="clouds">雲量</button></div></div><button id="resetMap" class="tw-home">回到台灣 ⌖</button></div><div id="windy" aria-label="台灣互動氣象地圖"></div><div id="mapStatus" class="tw-map-status">地圖載入中…</div><div class="tw-map-bottom"><div class="tw-legend"><b>CWA 測站氣溫</b><div class="tw-scale"></div><div class="tw-scale-labels"><span>&lt;10</span><span>15</span><span>20</span><span>25</span><span>30</span><span>≥35 °C</span></div></div><details class="tw-controls"><summary>顯示設定</summary><label><input type="checkbox" id="showStations" checked> 顯示測站</label><label><input type="checkbox" id="showLabels"> 顯示溫度標籤</label><label><input type="checkbox" id="autoRefresh" checked> 每 5 分鐘更新</label></details></div><article id="detail" class="tw-detail" hidden></article></div></section>
<section id="forecastView" class="tw-forecast" hidden><div class="tw-forecast-heading"><div><div class="tw-eyebrow">7-DAY FORECAST</div><h1>把未來一週，放進計畫。</h1><p class="tw-muted">台灣六大區域 · 每日最高與最低氣溫</p></div><div><label for="region">預報地區</label><select id="region"></select></div></div><p id="forecastStatus" role="status"></p><div id="forecastStats" class="tw-forecast-stats"></div><div class="tw-chart-card"><h2 id="chartTitle">氣溫趨勢</h2><div class="tw-chart-key"><span>● 最高溫</span><span>● 最低溫</span></div><div id="chart"></div></div><div class="tw-table-card"><div class="tw-table-title"><h2>每日預報明細</h2><button id="download">下載 CSV ↓</button></div><div class="tw-table-scroll"><table><thead><tr><th>日期</th><th>最低溫</th><th>最高溫</th><th>日夜溫差</th></tr></thead><tbody id="forecastTable"></tbody></table></div></div></section></main><script>window.addEventListener('error',e=>{if(e.target&&e.target.tagName==='SCRIPT')document.getElementById('mapStatus').textContent='地圖資源載入失敗，仍可使用測站列表。'},true)</script></body></html>
